[build]
  builder = "DOCKERFILE"
  dockerfilePath = "Dockerfile"
  watchPatterns = ["Dockerfile"]

[deploy]
  healthcheckPath = "/"
  healthcheckTimeout = 300
  numReplicas = 1
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 5

[[volumes]]
  name = "dispatcharr_data"
  mountPath = "/data"
  sizeGB = 5
